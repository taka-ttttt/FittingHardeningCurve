# Nginx設定（Docker用）

# アップストリーム定義
upstream fittinghardeningcurve_backend {
    server fittinghardeningcurve:8080;
}

# HTTPサーバー（HTTPSへリダイレクト）
server {
    listen 80;
    server_name _;

    # Let's Encrypt用（証明書取得時のみ使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # その他のリクエストはHTTPSへリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPSサーバー
server {
    listen 443 ssl http2;
    server_name _;

    # SSL証明書（Let's Encryptで取得したものを配置）
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSLセキュリティ設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ファイルアップロードサイズ制限
    client_max_body_size 10M;

    # ログ設定
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # プロキシ設定
    location / {
        proxy_pass http://fittinghardeningcurve_backend;
        proxy_http_version 1.1;
        
        # WebSocket対応
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # ヘッダー設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # キャッシュ
        proxy_cache_bypass $http_upgrade;
    }
}

